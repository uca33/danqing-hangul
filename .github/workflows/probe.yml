name: probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe yt
        shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for h in MBCNEWS11 mbcnews ytnnews24 ytn yonhapnewstv yonhapnews_tv YonhapnewsTV_ yonhapnewstv_ JTBCnews KBSNews kbs_news; do
            html=$(curl -s -L -A "$UA" -H "Accept-Language: ko-KR" -H "Cookie: CONSENT=YES+cb; SOCS=CAI" -m 15 "https://www.youtube.com/@$h/videos")
            id=$(echo "$html" | grep -o '"externalId":"UC[A-Za-z0-9_-]*"' | head -1)
            id2=$(echo "$html" | grep -o '"channelId":"UC[A-Za-z0-9_-]*"' | head -1)
            title=$(echo "$html" | grep -o '<title>[^<]*' | head -1)
            echo "@$h $id $id2 $title" | tee -a $GITHUB_STEP_SUMMARY
          done
          for id in UChlgI3UHCOnwUGzWzbJ3H5w UCF4Wxdo3inmxP-Y59wXDsFw; do
            for i in 1 2 3; do code=$(curl -s -L -A "$UA" -m 15 -o /tmp/y.txt -w "%{http_code}" "https://www.youtube.com/feeds/videos.xml?channel_id=$id"); echo "yt $id try$i $code $(grep -o '<title>[^<]*' /tmp/y.txt | head -1)" | tee -a $GITHUB_STEP_SUMMARY; sleep 2; done
          done
          curl -s -L -A "$UA" -m 15 https://rss.joins.com/joins_news_list.xml | head -c 600 | tee -a $GITHUB_STEP_SUMMARY
