name: 每日更新(论文 / 新闻 / 视频)

on:
  schedule:
    - cron: '0 21 * * *' # UTC 21:00 = 首尔时间次日 06:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 单元测试(解析与筛选逻辑)
        run: node --test "scripts/test/*.test.mjs"

      # 三个任务互不依赖,任何一个失败都不影响其它两个
      - name: 论文(KCI / RISS)
        continue-on-error: true
        env:
          KCI_API_KEY: ${{ secrets.KCI_API_KEY }}
          RISS_API_KEY: ${{ secrets.RISS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/update-papers.mjs

      - name: 新闻
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/update-news.mjs

      - name: 视频
        continue-on-error: true
        run: node scripts/update-videos.mjs

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "今天没有新数据"
          else
            git commit -m "chore(data): 每日更新 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
